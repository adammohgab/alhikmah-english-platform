name: Audit (temporary)

on:
  push:
    paths:
      - ".github/workflows/audit-temp.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report advisories
        run: |
          pnpm audit --json > "$RUNNER_TEMP/audit.json" || true
          node -e '
            const a=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/audit.json","utf8"));
            const out=[];
            for(const adv of Object.values(a.advisories||{})){
              const paths=[...new Set(adv.findings.flatMap(f=>f.paths))].slice(0,2).join(" | ");
              out.push(`${adv.severity} ${adv.module_name}@${adv.findings.map(f=>f.version).join(",")} patched ${adv.patched_versions} via ${paths}`);
            }
            console.log(out.join("%0A"));
            console.log("::warning title=audit::"+out.join("%0A"));
          '
