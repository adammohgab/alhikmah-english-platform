name: Audit (temporary)

on:
  push:
    paths:
      - ".github/workflows/audit-temp.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade vulnerable dev tooling
        run: pnpm add -D vite@^6.4.3 vitest@^3.2.6
      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "build: upgrade vite and vitest for security fixes"
          git push
