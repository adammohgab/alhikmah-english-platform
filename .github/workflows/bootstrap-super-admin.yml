name: Bootstrap Super Admin

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CREATE_SUPER_ADMIN to confirm the one-time privileged operation
        required: true
        type: string
      username:
        description: Unique username for the Super Admin profile
        required: true
        type: string
      display_name:
        description: Display name for the Super Admin profile
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bootstrap-super-admin
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ inputs.confirmation == 'CREATE_SUPER_ADMIN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install temporary Supabase client
        run: npm install --no-save --package-lock=false @supabase/supabase-js@2

      - name: Create or promote the configured Super Admin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          SUPERADMIN_USERNAME: ${{ inputs.username }}
          SUPERADMIN_DISPLAY_NAME: ${{ inputs.display_name }}
        run: node .github/scripts/bootstrap-super-admin.mjs
