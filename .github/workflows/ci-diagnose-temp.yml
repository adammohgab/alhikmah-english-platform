name: CI diagnose (temporary)

on:
  push:
    paths:
      - ".github/workflows/ci-diagnose-temp.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run vitest three times and report each failure
        run: |
          set +e
          for i in 1 2 3; do
            pnpm test > "$RUNNER_TEMP/vitest-$i.txt" 2>&1
            code=$?
            sed -i 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest-$i.txt"
            summary=$(grep -a -E "Test Files|Tests  " "$RUNNER_TEMP/vitest-$i.txt" | tr '\n' ' ')
            if [ "$code" -ne 0 ]; then
              body=$(grep -a -B2 -A30 -E "FAIL|AssertionError|Unable to find" "$RUNNER_TEMP/vitest-$i.txt" | grep -a -v "Future Flag" | head -c 9000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
              echo "::warning title=vitest-run-$i exit=$code::$summary%0A$body"
            else
              echo "::warning title=vitest-run-$i exit=0::$summary"
            fi
          done
          exit 0
