name: CI diagnose (temporary)

on:
  push:
    paths:
      - ".github/workflows/ci-diagnose-temp.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run every check and report each result as an annotation
        run: |
          set +e
          report() {
            name="$1"; shift
            "$@" > "$RUNNER_TEMP/out.txt" 2>&1
            code=$?
            body=$(tail -c 12000 "$RUNNER_TEMP/out.txt" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::warning title=$name exit=$code::$body"
          }
          pnpm test > "$RUNNER_TEMP/vitest.txt" 2>&1
          code=$?
          sed -i 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.txt"
          body=$(grep -a -E "FAIL|AssertionError|TestingLibraryElementError|Unable to find|Error:|Test Files|Tests  |expected" "$RUNNER_TEMP/vitest.txt" | grep -v "stderr" | head -c 12000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::warning title=vitest-failures exit=$code::$body"
          pnpm exec prettier --write src/pages/public/LoginPage/login-logic.ts > /dev/null 2>&1
          diffbody=$(git diff -- src/pages/public/LoginPage/login-logic.ts | head -c 8000 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::warning title=prettier-diff::$diffbody"
          exit 0
