name: CI diagnose (temporary)

on:
  push:
    paths:
      - ".github/workflows/ci-diagnose-temp.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run each check and report it as an annotation
        run: |
          set +e
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          strip() { sed 's/\x1b\[[0-9;]*m//g'; }

          pnpm exec tsc --noEmit -p tsconfig.app.json > "$RUNNER_TEMP/tsc.txt" 2>&1
          code=$?
          body=$(strip < "$RUNNER_TEMP/tsc.txt" | grep -a "error TS" | head -c 12000 | enc)
          echo "::warning title=typecheck-app exit=$code::$body"

          pnpm exec tsc --noEmit -p tsconfig.node.json > "$RUNNER_TEMP/tscn.txt" 2>&1
          code=$?
          body=$(strip < "$RUNNER_TEMP/tscn.txt" | grep -a "error TS" | head -c 4000 | enc)
          echo "::warning title=typecheck-node exit=$code::$body"

          pnpm exec eslint . -f unix > "$RUNNER_TEMP/eslint.txt" 2>&1
          code=$?
          body=$(strip < "$RUNNER_TEMP/eslint.txt" | head -c 12000 | enc)
          echo "::warning title=eslint exit=$code::$body"

          pnpm exec prettier --check . > "$RUNNER_TEMP/prettier.txt" 2>&1
          code=$?
          body=$(strip < "$RUNNER_TEMP/prettier.txt" | head -c 6000 | enc)
          echo "::warning title=prettier exit=$code::$body"

          pnpm test > "$RUNNER_TEMP/vitest.txt" 2>&1
          code=$?
          strip < "$RUNNER_TEMP/vitest.txt" > "$RUNNER_TEMP/vitest-clean.txt"
          summary=$(grep -a -E "Test Files|Tests  " "$RUNNER_TEMP/vitest-clean.txt" | tr '\n' ' ')
          body=$(grep -a -B2 -A25 -E "FAIL|AssertionError|Unable to find" "$RUNNER_TEMP/vitest-clean.txt" | grep -a -v "Future Flag" | head -c 8000 | enc)
          echo "::warning title=vitest exit=$code::$summary%0A$body"
          exit 0
