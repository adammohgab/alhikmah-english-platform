name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Test & Budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run ESLint
        run: pnpm run lint

      - name: Verify Prettier formatting
        run: pnpm run format:check

      - name: Run unit & component tests (Vitest)
        run: pnpm test

      - name: Build production bundle
        run: pnpm run build

      - name: Validate bundle size budget
        run: pnpm run check:budget

      - name: Verify static preview build artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "Static preview bundle verified successfully!"

      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: frontend/dist
          retention-days: 7
