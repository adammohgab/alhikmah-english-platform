name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Test & Budget
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run ESLint
        run: pnpm run lint

      - name: Verify Prettier formatting
        run: pnpm run format:check

      - name: Run unit & component tests (Vitest)
        run: pnpm test

      - name: Build production bundle
        run: pnpm run build

      - name: Validate bundle size budget
        run: pnpm run check:budget

      - name: Verify static preview build artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "Static preview bundle verified successfully!"

      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: frontend/dist
          retention-days: 7

  migrations:
    name: Database migrations and access checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply every migration to an empty database
        run: supabase/tests/apply-migrations.sh

      - name: Run the access checks
        run: psql -X -v ON_ERROR_STOP=1 -d alhikmah_migration_check -f supabase/tests/rls-smoke.sql
