name: Deps and format (temporary)

on:
  push:
    paths:
      - ".github/workflows/deps-and-format-temp.yml"

permissions:
  contents: write

jobs:
  fix:
    name: Add packages, format, verify and commit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Add react-hook-form and the Tiptap packages
        run: pnpm add react-hook-form @hookform/resolvers @tiptap/react @tiptap/pm @tiptap/starter-kit

      - name: Format with Prettier and Tailwind class sorting
        run: pnpm run format:write

      - name: Verify and publish the results as annotations
        run: |
          set +e
          emit() {
            title="$1"; file="$2"
            sed -i 's/\x1b\[[0-9;]*m//g' "$file"
            if [ ! -s "$file" ]; then
              echo "::notice title=$title::OK (no output)"
              return
            fi
            body=$(head -c 3500 "$file" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::warning title=$title::$body"
          }

          pnpm exec tsc --noEmit -p tsconfig.app.json > "$RUNNER_TEMP/tsc-app.txt" 2>&1
          echo "tsc app exit $?"
          grep -a "error TS" "$RUNNER_TEMP/tsc-app.txt" | sed 's|^src/||' > "$RUNNER_TEMP/tsc-errors.txt"
          emit "tsc-app" "$RUNNER_TEMP/tsc-errors.txt"

          pnpm exec tsc --noEmit -p tsconfig.node.json > "$RUNNER_TEMP/tsc-node.txt" 2>&1
          echo "tsc node exit $?"
          grep -a "error TS" "$RUNNER_TEMP/tsc-node.txt" > "$RUNNER_TEMP/tsc-node-errors.txt"
          emit "tsc-node" "$RUNNER_TEMP/tsc-node-errors.txt"

          pnpm exec eslint . -f unix > "$RUNNER_TEMP/eslint.txt" 2>&1
          echo "eslint exit $?"
          grep -a -E "\[(Error|Warning)/" "$RUNNER_TEMP/eslint.txt" | sed 's|^/home/runner/work/[^/]*/[^/]*/frontend/src/||' > "$RUNNER_TEMP/eslint-errors.txt"
          emit "eslint" "$RUNNER_TEMP/eslint-errors.txt"

          pnpm exec prettier --check . > "$RUNNER_TEMP/prettier.txt" 2>&1
          echo "prettier exit $?"
          grep -a "warn" "$RUNNER_TEMP/prettier.txt" > "$RUNNER_TEMP/prettier-files.txt"
          emit "prettier" "$RUNNER_TEMP/prettier-files.txt"

          pnpm test > "$RUNNER_TEMP/vitest.txt" 2>&1
          echo "vitest exit $?"
          grep -a -E "FAIL|AssertionError|Unable to find|Test Files|Tests  |Error:" "$RUNNER_TEMP/vitest.txt" | grep -a -v "Future Flag" > "$RUNNER_TEMP/vitest-summary.txt"
          emit "vitest" "$RUNNER_TEMP/vitest-summary.txt"

          pnpm run build > "$RUNNER_TEMP/build.txt" 2>&1
          echo "build exit $?"
          tail -n 25 "$RUNNER_TEMP/build.txt" > "$RUNNER_TEMP/build-tail.txt"
          emit "build" "$RUNNER_TEMP/build-tail.txt"

          pnpm run check:budget > "$RUNNER_TEMP/budget.txt" 2>&1
          echo "budget exit $?"
          emit "budget" "$RUNNER_TEMP/budget.txt"

          git diff --stat -- package.json pnpm-lock.yaml > "$RUNNER_TEMP/deps-diff.txt"
          emit "deps-diff" "$RUNNER_TEMP/deps-diff.txt"
          grep -n -E "react-hook-form|@hookform/resolvers|@tiptap/(react|pm|starter-kit)" package.json > "$RUNNER_TEMP/deps-versions.txt"
          emit "deps-versions" "$RUNNER_TEMP/deps-versions.txt"
          exit 0

      - name: Commit package files and formatting
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/pnpm-lock.yaml frontend/src
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "build: add react-hook-form and Tiptap, apply Prettier"
          git pull --rebase origin main
          git push origin HEAD:main
