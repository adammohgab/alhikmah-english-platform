name: Diagnose (temporary)

on:
  push:
    paths:
      - ".github/workflows/diag-temp.yml"

permissions:
  contents: read

jobs:
  tsc:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Report type errors
        run: |
          pnpm exec tsc --noEmit -p tsconfig.app.json --pretty false > "$RUNNER_TEMP/t1.txt" 2>&1 || true
          pnpm exec tsc --noEmit -p tsconfig.node.json --pretty false > "$RUNNER_TEMP/t2.txt" 2>&1 || true
          cat "$RUNNER_TEMP/t1.txt" "$RUNNER_TEMP/t2.txt" | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::warning title=tsc::/'
